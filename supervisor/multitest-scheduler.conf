[program:multitest-schedule]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/APP_USER/data/www/multitest.uz
command=/usr/bin/php /var/www/APP_USER/data/www/multitest.uz/artisan schedule:work
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=APP_USER
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/APP_USER/data/www/multitest.uz/storage/logs/schedule.log
stopwaitsecs=3600
