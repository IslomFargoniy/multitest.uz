<svg width="1200" height="780" viewBox="0 0 1200 780" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #0B1020; }
      .surface { fill: #111830; stroke: #1E2744; stroke-width: 1; }
      .surface-2 { fill: #172040; }
      .surface-sunken { fill: #0D1326; stroke: #1E2744; stroke-width: 1; }
      .text-title { fill: #E8ECF5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; }
      .text-body { fill: #E8ECF5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; }
      .text-muted { fill: #9AA5BD; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="780" class="bg" />

  <!-- Top Bar -->
  <rect x="0" y="0" width="1200" height="64" class="surface-sunken" />
  <circle cx="48" cy="32" r="14" fill="#5B63E6" />
  <path d="M42 27 L48 37 L54 27" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <text x="72" y="38" class="text-title" font-size="18">MultiTest<tspan fill="#5B63E6">.uz</tspan></text>
  <text x="210" y="38" class="text-muted" font-size="13">Boshqaruv / Natijalar / <tspan class="text-title">Urinish #1042</tspan></text>

  <!-- Certificate & Official Score Banner -->
  <rect x="80" y="88" width="1040" height="190" rx="20" class="surface" stroke="#3FCF8E" stroke-opacity="0.3" />
  
  <!-- Left: Big CEFR C1 Certificate Seal -->
  <rect x="116" y="118" width="130" height="130" rx="24" fill="#173628" stroke="#3FCF8E" stroke-width="2" />
  <circle cx="181" cy="165" r="32" fill="#1B4D36" />
  <text x="160" y="174" fill="#6EE0A8" font-family="sans-serif" font-weight="900" font-size="28">C1</text>
  <text x="138" y="222" fill="#6EE0A8" font-family="sans-serif" font-weight="700" font-size="11">UZBMB RASMIY</text>

  <!-- Center: Candidate & Test details -->
  <text x="274" y="132" class="text-muted" font-size="12">TEST NATIJASI VA SERTIFIKAT</text>
  <text x="274" y="160" class="text-title" font-size="24">UzBMB Milliy Sertifikat — Mock #12</text>
  
  <text x="274" y="190" class="text-muted" font-size="13">Nomzod: <tspan class="text-title">Islom Farg'oniy</tspan> · Sana: <tspan class="text-title">05.10.2026</tspan> · Baholash: <tspan fill="#6EE0A8">AI + O'qituvchi tasdiqlagan</tspan></text>

  <rect x="274" y="210" width="150" height="30" rx="6" class="surface-2" />
  <text x="286" y="230" class="text-title" font-size="14">Umumiy ball: <tspan fill="#6EE0A8" font-size="16">68</tspan> / 75</text>

  <rect x="436" y="210" width="150" height="30" rx="6" class="surface-2" />
  <text x="448" y="230" class="text-title" font-size="14">Daraja: <tspan fill="#6EE0A8" font-size="16">C1 (Ilg'or)</tspan></text>

  <!-- Right: Actions (Download PDF & Share) -->
  <rect x="880" y="128" width="200" height="46" rx="10" fill="#5B63E6" />
  <text x="906" y="156" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="13">Sertifikatni yuklab olish (PDF)</text>

  <rect x="880" y="186" width="200" height="42" rx="10" class="surface-2" stroke="#2A3557" stroke-width="1" />
  <text x="930" y="212" class="text-title" font-size="13">Ulashish (Share) ↗</text>

