  <text x="110" y="356" class="text-muted" font-size="12">Davlat ta'lim standarti talablari asosida</text>

  <!-- Crit 1 -->
  <text x="110" y="396" class="text-body" font-size="13">Fluency (Ravonlik)</text>
  <text x="450" y="396" fill="#6EE0A8" font-family="sans-serif" font-weight="700" font-size="13">7.0 / 7.5</text>
  <rect x="110" y="406" width="390" height="8" rx="4" class="surface-2" />
  <rect x="110" y="406" width="364" height="8" rx="4" fill="#3FCF8E" />

  <!-- Crit 2 -->
  <text x="110" y="446" class="text-body" font-size="13">Vocabulary (Lug'at)</text>
