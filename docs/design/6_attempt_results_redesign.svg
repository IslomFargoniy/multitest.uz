  <rect x="110" y="456" width="390" height="8" rx="4" class="surface-2" />
  <rect x="110" y="456" width="364" height="8" rx="4" fill="#3FCF8E" />

  <!-- Crit 3 -->
  <text x="110" y="496" class="text-body" font-size="13">Grammar (Grammatika)</text>
  <text x="450" y="496" fill="#AEB5FF" font-family="sans-serif" font-weight="700" font-size="13">6.0 / 7.5</text>
  <rect x="110" y="506" width="390" height="8" rx="4" class="surface-2" />
  <rect x="110" y="506" width="312" height="8" rx="4" fill="#5B63E6" />

  <!-- Crit 4 -->
  <text x="110" y="546" class="text-body" font-size="13">Pronunciation (Talaffuz)</text>
  <text x="450" y="546" fill="#6EE0A8" font-family="sans-serif" font-weight="700" font-size="13">7.2 / 7.5</text>
  <rect x="110" y="556" width="390" height="8" rx="4" class="surface-2" />
  <rect x="110" y="556" width="374" height="8" rx="4" fill="#3FCF8E" />

  <!-- Crit 5 -->
  <text x="110" y="596" class="text-body" font-size="13">Interaction (Muloqot)</text>
  <text x="450" y="596" fill="#AEB5FF" font-family="sans-serif" font-weight="700" font-size="13">6.5 / 7.5</text>
  <rect x="110" y="606" width="390" height="8" rx="4" class="surface-2" />
  <rect x="110" y="606" width="338" height="8" rx="4" fill="#5B63E6" />

  <!-- CEFR Level scale card -->
  <rect x="110" y="640" width="390" height="76" rx="10" class="surface-2" stroke="#1E2744" stroke-width="1" />
  <text x="126" y="664" class="text-muted" font-size="11">SERTIFIKAT STATUSI:</text>
  <text x="126" y="688" fill="#6EE0A8" font-family="sans-serif" font-weight="700" font-size="14">✅ C1 daraja talabi to'liq bajarildi</text>
  <text x="126" y="704" class="text-muted" font-size="11">Davlat attestatsiyasida 100% ustama olish huquqini beradi.</text>

  <!-- Right: Question-by-Question Audio Review -->
  <rect x="550" y="300" width="570" height="440" rx="16" class="surface" />
  <text x="578" y="336" class="text-title" font-size="17">Savollar Bo'yicha Audio Tahlil</text>
  <text x="578" y="356" class="text-muted" font-size="12">Yozilgan javoblaringizni tinglang va fikr-mulohazalarni o'qing</text>

  <!-- Question 1 Accordion Card (Expanded) -->
  <rect x="576" y="380" width="518" height="190" rx="12" class="surface-2" stroke="#5B63E6" stroke-width="1" />
  <rect x="590" y="394" width="60" height="22" rx="4" fill="#262F66" />
  <text x="598" y="409" fill="#AEB5FF" font-family="sans-serif" font-weight="700" font-size="11">Part 1.1</text>
  <text x="660" y="410" class="text-title" font-size="13">What is your favourite type of weather?</text>
  <text x="1030" y="410" fill="#6EE0A8" font-family="sans-serif" font-weight="700" font-size="13">7.2 ball</text>

  <!-- Audio player in review -->
  <rect x="590" y="426" width="490" height="40" rx="8" class="surface-sunken" />
  <circle cx="612" cy="446" r="12" fill="#5B63E6" />
  <path d="M609 441 L618 446 L609 451 Z" fill="#FFFFFF" />
  <text x="632" y="450" class="text-muted" font-size="11">00:18 / 00:24</text>
  <line x1="710" y1="446" x2="1010" y2="446" stroke="#2A3557" stroke-width="3" stroke-linecap="round" />
  <line x1="710" y1="446" x2="880" y2="446" stroke="#5B63E6" stroke-width="3" stroke-linecap="round" />
  <text x="1030" y="450" class="text-title" font-size="11">1.0x</text>

  <!-- AI / Teacher Feedback note -->
  <rect x="590" y="476" width="490" height="80" rx="8" fill="#111830" stroke="#1E2744" stroke-width="1" />
  <text x="604" y="498" fill="#AEB5FF" font-family="sans-serif" font-weight="700" font-size="12">💡 Sun'iy intellekt tahlili:</text>
  <text x="604" y="520" class="text-muted" font-size="12">"Fikr bildirish ravon va tabiiy. Lug'at boyligi yaxshi namoyon bo'lgan ('crisp autumn morning', 'refreshing breeze'). Grammatikada hech qanday jiddiy xato aniqlanmadi."</text>

  <!-- Question 2 Accordion Card (Collapsed) -->
  <rect x="576" y="584" width="518" height="58" rx="10" class="surface-2" stroke="#1E2744" stroke-width="1" />
  <rect x="590" y="602" width="60" height="22" rx="4" class="surface" />
  <text x="598" y="617" class="text-muted" font-size="11">Part 1.2</text>
  <text x="660" y="618" class="text-body" font-size="13">Do you prefer studying alone or in a group?</text>
  <text x="1030" y="618" fill="#6EE0A8" font-family="sans-serif" font-weight="700" font-size="13">6.8 ball</text>

  <!-- Question 3 Accordion Card (Collapsed) -->
  <rect x="576" y="654" width="518" height="58" rx="10" class="surface-2" stroke="#1E2744" stroke-width="1" />
  <rect x="590" y="672" width="60" height="22" rx="4" class="surface" />
  <text x="598" y="687" class="text-muted" font-size="11">Part 2</text>
  <text x="660" y="688" class="text-body" font-size="13">Describe a traditional dish you like...</text>
  <text x="1030" y="688" fill="#6EE0A8" font-family="sans-serif" font-weight="700" font-size="13">7.0 ball</text>
