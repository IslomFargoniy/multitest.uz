<svg width="1200" height="780" viewBox="0 0 1200 780" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #0B1020; }
      .surface { fill: #111830; stroke: #1E2744; stroke-width: 1; }
      .surface-2 { fill: #172040; }
      .surface-sunken { fill: #0D1326; stroke: #1E2744; stroke-width: 1; }
      .primary-btn { fill: #5B63E6; }
      .text-title { fill: #E8ECF5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; }
      .text-body { fill: #E8ECF5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; }
      .text-muted { fill: #9AA5BD; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; }
      .accent-c1 { fill: #9ED8BE; }
      .accent-b2 { fill: #9EB0EC; }
      .success { fill: #3FCF8E; }
    </style>
    <filter id="card-shadow" x="-4" y="-2" width="108%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="780" class="bg" />

  <!-- Top Navigation Bar -->
  <rect x="0" y="0" width="1200" height="64" class="surface-sunken" />
  <circle cx="48" cy="32" r="14" fill="#5B63E6" />
  <path d="M42 27 L48 37 L54 27" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <text x="72" y="38" class="text-title" font-size="18">MultiTest<tspan fill="#5B63E6">.uz</tspan></text>

  <!-- Nav links -->
  <rect x="220" y="18" width="105" height="28" rx="6" fill="#262F66" />
  <text x="240" y="36" fill="#AEB5FF" font-family="sans-serif" font-weight="700" font-size="13">Boshqaruv</text>
  <text x="350" y="36" class="text-muted" font-size="13">Testlar</text>
  <text x="430" y="36" class="text-muted" font-size="13">Mock Imtihonlar</text>
  <text x="560" y="36" class="text-muted" font-size="13">Natijalarim</text>

  <!-- User Profile Badge -->
  <rect x="1040" y="16" width="130" height="32" rx="16" class="surface-2" stroke="#2A3557" stroke-width="1" />
  <circle cx="1056" cy="32" r="10" fill="#5B63E6" />
  <text x="1052" y="36" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="11">IF</text>
  <text x="1074" y="36" class="text-title" font-size="12">Islom F.</text>

  <!-- Integrated Welcome & Action Hero Banner -->
  <g filter="url(#card-shadow)">
    <rect x="48" y="90" width="1104" height="96" rx="16" class="surface" />
    <circle cx="88" cy="138" r="24" fill="#172040" stroke="#2A3557" stroke-width="1" />
    <path d="M80 138 L88 130 L96 138" stroke="#5B63E6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <text x="128" y="130" class="text-title" font-size="22">Xush kelibsiz, Islom! 👋</text>
    <text x="128" y="152" class="text-muted" font-size="13">Speaking darajangiz: C1 (Ilg'or). Keyingi mock testga tayyormisiz?</text>
    
    <rect x="940" y="116" width="180" height="44" rx="10" class="primary-btn" />
    <text x="965" y="143" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="14">Imtihonni boshlash →</text>
  </g>

  <!-- 4-Stat Grid -->
  <!-- Stat 1 -->
  <rect x="48" y="210" width="260" height="110" rx="14" class="surface" />
  <text x="70" y="240" class="text-muted" font-size="12">JAMI TOPSHIRILGAN</text>
  <text x="70" y="280" class="text-title" font-size="30">24 <tspan class="text-muted" font-size="14">ta test</tspan></text>
  <rect x="230" y="230" width="56" height="22" rx="4" fill="#173628" />
  <text x="238" y="245" fill="#6EE0A8" font-family="sans-serif" font-weight="700" font-size="11">+4 bu oy</text>

  <!-- Stat 2 -->
  <rect x="330" y="210" width="260" height="110" rx="14" class="surface" />
  <text x="352" y="240" class="text-muted" font-size="12">O'RTACHA BALL</text>
  <text x="352" y="280" class="text-title" font-size="30">64.5 <tspan class="text-muted" font-size="14">/ 75</tspan></text>
  <rect x="520" y="230" width="50" height="22" rx="4" fill="#2A3557" />
  <text x="530" y="245" fill="#AEB5FF" font-family="sans-serif" font-weight="700" font-size="11">B2+</text>

  <!-- Stat 3 -->
  <rect x="612" y="210" width="260" height="110" rx="14" class="surface" />
  <text x="634" y="240" class="text-muted" font-size="12">ENG YUQORI NATIJA</text>
  <text x="634" y="280" class="text-title" font-size="30">71.0 <tspan class="text-muted" font-size="14">/ 75</tspan></text>
  <rect x="795" y="230" width="56" height="22" rx="4" fill="#173628" />
  <text x="805" y="245" fill="#6EE0A8" font-family="sans-serif" font-weight="700" font-size="11">Top 3%</text>

  <!-- Stat 4: So'nggi Natija with CEFR C1 Badge -->
  <rect x="894" y="210" width="258" height="110" rx="14" class="surface" stroke="#3FCF8E" stroke-opacity="0.4" />
  <text x="916" y="240" class="text-muted" font-size="12">SO'NGGI IMTIHON</text>
  <text x="916" y="280" class="text-title" font-size="30">69 <tspan class="text-muted" font-size="14">ball</tspan></text>
  <rect x="1070" y="228" width="62" height="26" rx="6" fill="#173628" stroke="#3FCF8E" stroke-width="1" />
  <text x="1084" y="245" fill="#6EE0A8" font-family="sans-serif" font-weight="800" font-size="13">C1</text>

  <!-- Bottom Section: Chart (Left) + Recent Attempts (Right) -->
  <!-- Left: Radar / Skills Breakdown -->
  <rect x="48" y="344" width="542" height="390" rx="16" class="surface" />
  <text x="76" y="380" class="text-title" font-size="17">Speaking Ko'nikmalari Tahlili</text>
  <text x="76" y="400" class="text-muted" font-size="12">UzBMB 5 ta asosiy mezoni bo'yicha kuchli tomonlaringiz</text>

  <!-- Criteria progress bars -->
  <!-- Criterion 1 -->
  <text x="76" y="445" class="text-body" font-size="13">Ravonlik va izchillik (Fluency)</text>
  <text x="510" y="445" class="text-title" font-size="13">6.8 / 7.5</text>
  <rect x="76" y="455" width="460" height="8" rx="4" class="surface-2" />
  <rect x="76" y="455" width="418" height="8" rx="4" fill="#5B63E6" />

  <!-- Criterion 2 -->
  <text x="76" y="495" class="text-body" font-size="13">Lug'at boyligi (Vocabulary)</text>
  <text x="510" y="495" class="text-title" font-size="13">7.2 / 7.5</text>
  <rect x="76" y="505" width="460" height="8" rx="4" class="surface-2" />
  <rect x="76" y="505" width="441" height="8" rx="4" fill="#3FCF8E" />

  <!-- Criterion 3 -->
  <text x="76" y="545" class="text-body" font-size="13">Grammatik aniqlik (Grammar)</text>
  <text x="510" y="545" class="text-title" font-size="13">6.0 / 7.5</text>
  <rect x="76" y="555" width="460" height="8" rx="4" class="surface-2" />
  <rect x="76" y="555" width="368" height="8" rx="4" fill="#F5B14C" />

  <!-- Criterion 4 -->
  <text x="76" y="595" class="text-body" font-size="13">Talaffuz (Pronunciation)</text>
  <text x="510" y="595" class="text-title" font-size="13">7.0 / 7.5</text>
  <rect x="76" y="605" width="460" height="8" rx="4" class="surface-2" />
  <rect x="76" y="605" width="430" height="8" rx="4" fill="#5B63E6" />

  <!-- Criterion 5 -->
  <text x="76" y="645" class="text-body" font-size="13">Muloqot va interaksiya (Interaction)</text>
  <text x="510" y="645" class="text-title" font-size="13">6.5 / 7.5</text>
  <rect x="76" y="655" width="460" height="8" rx="4" class="surface-2" />
  <rect x="76" y="655" width="398" height="8" rx="4" fill="#5B63E6" />

  <!-- Right: Recent Attempts Table -->
  <rect x="610" y="344" width="542" height="390" rx="16" class="surface" />
  <text x="638" y="380" class="text-title" font-size="17">So'nggi Urinishlar</text>
  <text x="638" y="400" class="text-muted" font-size="12">Eng oxirgi topshirilgan testlar va olingan baholar</text>

  <!-- Attempt Row 1 -->
  <rect x="634" y="425" width="494" height="64" rx="10" class="surface-2" stroke="#1E2744" stroke-width="1" />
  <rect x="646" y="440" width="36" height="34" rx="6" fill="#173628" stroke="#3FCF8E" stroke-width="1" />
  <text x="654" y="462" fill="#6EE0A8" font-family="sans-serif" font-weight="800" font-size="12">C1</text>
  <text x="694" y="450" class="text-body" font-size="13">UzBMB Milliy Sertifikat — Mock #12</text>
  <text x="694" y="468" class="text-muted" font-size="11">Bugun, 10:20 · 69 ball (AI + O'qituvchi)</text>
  <rect x="1030" y="442" width="84" height="30" rx="6" fill="#262F66" />
  <text x="1046" y="462" fill="#AEB5FF" font-family="sans-serif" font-weight="700" font-size="12">Tahlil →</text>

  <!-- Attempt Row 2 -->
  <rect x="634" y="500" width="494" height="64" rx="10" class="surface-2" stroke="#1E2744" stroke-width="1" />
  <rect x="646" y="515" width="36" height="34" rx="6" fill="#202A54" stroke="#9EB0EC" stroke-width="1" />
  <text x="653" y="537" fill="#9EB0EC" font-family="sans-serif" font-weight="800" font-size="12">B2</text>
  <text x="694" y="525" class="text-body" font-size="13">IELTS Speaking Full Simulation #4</text>
  <text x="694" y="543" class="text-muted" font-size="11">3 oktabr · 62 ball</text>
  <rect x="1030" y="517" width="84" height="30" rx="6" class="surface" />
  <text x="1046" y="537" class="text-muted" font-family="sans-serif" font-weight="600" font-size="12">Tahlil →</text>

  <!-- Attempt Row 3 -->
  <rect x="634" y="575" width="494" height="64" rx="10" class="surface-2" stroke="#1E2744" stroke-width="1" />
  <rect x="646" y="590" width="36" height="34" rx="6" fill="#173628" stroke="#3FCF8E" stroke-width="1" />
  <text x="654" y="612" fill="#6EE0A8" font-family="sans-serif" font-weight="800" font-size="12">C1</text>
  <text x="694" y="600" class="text-body" font-size="13">CEFR Multi-Level Speaking Test #7</text>
  <text x="694" y="618" class="text-muted" font-size="11">28 sentabr · 71 ball</text>
  <rect x="1030" y="592" width="84" height="30" rx="6" class="surface" />
  <text x="1046" y="612" class="text-muted" font-family="sans-serif" font-weight="600" font-size="12">Tahlil →</text>
</svg>
