  <text x="826" y="340" class="text-title" font-size="20">IELTS Full Speaking #5</text>
  <text x="826" y="364" class="text-muted" font-size="12">IELTS Part 1, 2 va 3 savollari jamlanmasi</text>

  <text x="826" y="425" class="text-body" font-size="13">📋 Bo'limlar:</text>
  <text x="1044" y="425" class="text-title" font-size="13">3 ta bo'lim</text>
  <line x1="826" y1="440" x2="1128" y2="440" stroke="#1E2744" stroke-width="1" />

  <text x="826" y="465" class="text-body" font-size="13">⏱ Davomiyligi:</text>
  <text x="1064" y="465" class="text-title" font-size="13">14 daqiqa</text>
  <line x1="826" y1="480" x2="1128" y2="480" stroke="#1E2744" stroke-width="1" />

