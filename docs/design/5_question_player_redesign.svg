  <rect x="990" y="16" width="170" height="36" rx="8" class="surface-2" stroke="#2A3557" stroke-width="1" />
  <circle cx="1010" cy="34" r="5" fill="#3FCF8E" />
  <text x="1024" y="39" fill="#3FCF8E" font-family="sans-serif" font-weight="700" font-size="12">Nazorat Faol</text>
  <text x="1106" y="39" class="text-title" font-size="13">18:40</text>

