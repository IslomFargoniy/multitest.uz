  <text x="228" y="143" fill="#AEB5FF" font-family="sans-serif" font-weight="700" font-size="12">SAVOL 3 / 8</text>

  <rect x="336" y="126" width="120" height="26" rx="6" class="surface-2" />
  <text x="348" y="143" class="text-muted" font-size="12">Tayyorgarlik: 20s</text>

  <rect x="466" y="126" width="120" height="26" rx="6" class="surface-2" />
  <text x="478" y="143" class="text-muted" font-size="12">Javob vaqti: 60s</text>

  <!-- Question Content Box -->
  <text x="216" y="196" class="text-title" font-size="20">Describe an interesting tradition or festival in your country.</text>
  
  <rect x="216" y="220" width="768" height="150" rx="12" class="surface-2" stroke="#1E2744" stroke-width="1" />
  <text x="240" y="250" class="text-body" font-size="14">You should say:</text>
  <text x="260" y="275" class="text-muted" font-size="14">• What the festival or tradition is and when it takes place</text>
  <text x="260" y="300" class="text-muted" font-size="14">• What people do during this occasion</text>
  <text x="260" y="325" class="text-muted" font-size="14">• What food or music is associated with it</text>
  <text x="260" y="350" class="text-muted" font-size="14">• And explain why you find it meaningful or enjoyable</text>

  <!-- Live Audio Recording Box -->
  <rect x="216" y="390" width="768" height="166" rx="14" class="surface-sunken" stroke="#5B63E6" stroke-width="1.5" />
  
  <!-- Recording Status Indicator -->
  <circle cx="250" cy="426" r="6" fill="#F07178" />
  <text x="266" y="431" fill="#F07178" font-family="sans-serif" font-weight="700" font-size="13">OVOZ YOZILMOQDA</text>
  <text x="890" y="431" class="text-title" font-size="15">00:38 <tspan class="text-muted" font-size="12">/ 01:00</tspan></text>

